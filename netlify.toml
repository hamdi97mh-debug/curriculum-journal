[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API data -> fungsi penghubung spreadsheet
[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Semua halaman (/, /jurnal, /pekerjaan, /pekerjaan/...) dilayani oleh index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
